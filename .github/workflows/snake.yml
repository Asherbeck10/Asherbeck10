name: Contribution Snake

'on':
workflow_dispatch:

jobs:
generate:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - name: Generate snake
    uses: Platane/snk@v3
    with:
      github_user_name: Asherbeck10
      outputs: dist/github-contribution-grid-snake.svg

  - name: Deploy snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
      target_branch: output
```
